name: Images

# A push to main publishes the images to the GitHub Container Registry. Started by hand it does the
# same, and only from main: another branch is not published under the names everybody pulls.
on:
  push:
    branches: [main]
    # brewless-malware has its own workflow (malware.yml); a change to it alone rebuilds and rolls out
    # no base or builder image.
    paths-ignore: ['malware/**', '.github/workflows/malware.yml', '.github/workflows/signature-mirror.yml']
  workflow_dispatch:
    inputs:
      reason:
        description: 'What the runtime-updates workflow published for, as JSON: {"php": {...}, "new_versions": [...], "vulnerabilities": [...]}'
        required: false
        default: '{}'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      publish: true

  # Tell Brewless the images are published (BL-303), with the realtime version and what the runtime-updates
  # workflow published for, the new PHP minors among it (new_versions, BL-305) included. Brewless reads the images from ghcr.io itself and rolls new ones out to every
  # application; it only acts when a digest changed, so every publish may call. The request is signed over
  # its moment and body with the shared secret. The address and the secret are repository secrets: the
  # Actions logs of this public repository never show them.
  notify:
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Call Brewless
        env:
          URL: ${{ secrets.BREWLESS_IMAGES_WEBHOOK_URL }}
          SECRET: ${{ secrets.BREWLESS_IMAGES_WEBHOOK_SECRET }}
          REASON: ${{ github.event.inputs.reason || '{}' }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::warning::The secret BREWLESS_IMAGES_WEBHOOK_URL or BREWLESS_IMAGES_WEBHOOK_SECRET is not set; Brewless is not told."
            exit 0
          fi
          version="$(tr -d '[:space:]' < realtime/VERSION)"
          body=$(echo "$REASON" | jq -c --arg realtime "$version" '{event: "published", realtime: (if $realtime == "" then null else $realtime end), vulnerabilities: (.vulnerabilities // []), new_versions: (.new_versions // [])}')
          moment="$(date +%s)"
          signature="sha256=$(printf '%s' "$moment.$body" | openssl dgst -sha256 -hmac "$SECRET" -r | cut -d' ' -f1)"
          curl -fsS -o /dev/null -X POST "$URL" -H 'Content-Type: application/json' -H "X-Brewless-Timestamp: $moment" -H "X-Brewless-Signature: $signature" --data "$body" 2>/dev/null \
            || { echo "::error::Brewless did not take the report (the address and the error are left out of this public log)."; exit 1; }
