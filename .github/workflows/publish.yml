name: Images

# Every push to main publishes the images to the GitHub Container Registry;
# a pull request only builds them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        target: [base, builder]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: PHP_VERSION=${{ matrix.php }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/brewless-${{ matrix.target }}:php${{ matrix.php }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.php }}

  # brewless-realtime carries its own version (realtime/VERSION). A published
  # version is never replaced: Brewless pins it, so a change to the image
  # publishes only once the version is raised. Tags: 1.0.0, 1.0 and 1.
  realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Version
        id: version
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/brewless-realtime
          EVENT: ${{ github.event_name }}
        run: |
          version="$(tr -d '[:space:]' < realtime/VERSION)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::realtime/VERSION is not x.y.z: $version"; exit 1; }
          publish=true
          if [ "$EVENT" = pull_request ]; then
            publish=false
          elif docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            publish=false
            echo "::notice::$IMAGE:$version is already published; raise realtime/VERSION to publish a change."
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "tags=$IMAGE:$version,$IMAGE:${version%.*},$IMAGE:${version%%.*}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: realtime
          build-args: VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: brewless-realtime:ci
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,mode=max,scope=realtime
      - name: Smoke test
        run: |
          docker run -d --name realtime -p 8080:8080 \
            -e REVERB_APP_ID=123456 -e REVERB_APP_KEY=ci-key -e REVERB_APP_SECRET=ci-secret brewless-realtime:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/up && break; sleep 1; done
          curl -fsS http://localhost:8080/up
          docker stop realtime
          test "$(docker inspect -f '{{.State.ExitCode}}' realtime)" = 0
          docker logs realtime 2>&1 | grep -q 'code 4200'
          out="$(timeout 30 docker run --rm brewless-realtime:ci 2>&1 || true)"
          echo "$out" | grep -q 'missing required variable'
      - name: Push
        if: steps.version.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            docker tag brewless-realtime:ci "$tag"
            docker push "$tag"
          done
