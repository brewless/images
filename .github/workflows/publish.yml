name: Images

# A push to main publishes the images to the GitHub Container Registry. Started by hand it does the
# same, and only from main: another branch is not published under the names everybody pulls.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      publish: true
