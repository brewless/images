name: Images

# Every push to main publishes both images to the GitHub Container Registry;
# a pull request only builds them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        target: [base, builder]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: PHP_VERSION=${{ matrix.php }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/brewless-${{ matrix.target }}:php${{ matrix.php }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.php }}
