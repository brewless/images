name: Build the images

# The jobs that build the images, and publish them when the caller says so. Called by
# publish.yml (a push to main) and by build.yml (a pull request). It asks for no permissions of
# its own: it gets the ones of its caller, and only publish.yml may write packages.
on:
  workflow_call:
    inputs:
      publish:
        description: Push the images to the GitHub Container Registry
        type: boolean
        default: false

# The actions are taken by commit, not by tag: a tag can be moved to other code,
# a commit cannot. To update one, change the commit and the version behind it together.
jobs:
  # The PHP versions are the lines of php-versions (BL-305), which runtime-updates.yml adds a new
  # minor to by itself; the matrix below is made from it, so no version is listed here.
  versions:
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.read.outputs.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read php-versions
        id: read
        run: |
          if grep -vqE '^[0-9]+\.[0-9]+$' php-versions; then
            echo "::error::php-versions holds a line that is not a version such as 8.4."
            exit 1
          fi
          echo "php=$(jq -R . php-versions | jq -cs .)" >> "$GITHUB_OUTPUT"

  images:
    needs: [versions]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.php) }}
        target: [base, builder]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token the checkout was made with is not left in .git, where a build step could read it.
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: PHP_VERSION=${{ matrix.php }}
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository_owner }}/brewless-${{ matrix.target }}:php${{ matrix.php }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.php }}

  # brewless-realtime carries its own version (realtime/VERSION). A published
  # version is never replaced: Brewless pins it, so a change to the image
  # publishes only once the version is raised. Tags: 1.0.0, 1.0 and 1.
  realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token the checkout was made with is not left in .git, where a build step could read it.
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Version
        id: version
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/brewless-realtime
          PUBLISH: ${{ inputs.publish }}
        run: |
          version="$(tr -d '[:space:]' < realtime/VERSION)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::realtime/VERSION is not x.y.z: $version"; exit 1; }
          publish=true
          if [ "$PUBLISH" != true ]; then
            publish=false
          elif docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            publish=false
            echo "::notice::$IMAGE:$version is already published; raise realtime/VERSION to publish a change."
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "tags=$IMAGE:$version,$IMAGE:${version%.*},$IMAGE:${version%%.*}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: realtime
          build-args: VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: brewless-realtime:ci
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,mode=max,scope=realtime
      - name: Smoke test
        run: |
          docker run -d --name realtime -p 8080:8080 \
            -e REVERB_APP_ID=123456 -e REVERB_APP_KEY=ci-key -e REVERB_APP_SECRET=ci-secret brewless-realtime:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/up && break; sleep 1; done
          curl -fsS http://localhost:8080/up
          docker stop realtime
          test "$(docker inspect -f '{{.State.ExitCode}}' realtime)" = 0
          docker logs realtime 2>&1 | grep -q 'code 4200'
          out="$(timeout 30 docker run --rm brewless-realtime:ci 2>&1 || true)"
          echo "$out" | grep -q 'missing required variable'
      - name: Push
        if: steps.version.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            docker tag brewless-realtime:ci "$tag"
            docker push "$tag"
          done
