; Brewless runtime settings.
; PHP2Shell (CVE-2026-109618): no PHP memory limit until every image runs a
; patched PHP. The container's own memory limit is the boundary instead.
; Put 256M back once the patched images are published.
memory_limit = -1
expose_php = Off
variables_order = EGPCS

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code in an image never changes, so there is nothing to revalidate.
opcache.validate_timestamps = 0

; PHP2Shell (CVE-2026-109619): blocks the confirmed session paths until every
; image runs PHP 8.5.12, 8.4.27, 8.3.36 or newer. No application uses upload
; progress, so this stays off after the patch as well.
session.upload_progress.enabled = Off
session.use_strict_mode = 1
; PHP 8.5 only, ignored by older versions: blocks the fatal backtrace path.
fatal_error_backtraces = Off
