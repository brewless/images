; Brewless runtime settings.
memory_limit = 256M
expose_php = Off
variables_order = EGPCS

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code in an image never changes, so there is nothing to revalidate.
opcache.validate_timestamps = 0

; PHP2Shell (CVE-2026-109618, CVE-2026-109619) is fixed in PHP 8.5.12, 8.4.27
; and 8.3.36; the Dockerfile refuses an older PHP. These stay as defence in
; depth: no application uses upload progress.
session.upload_progress.enabled = Off
session.use_strict_mode = 1
; PHP 8.5 only, ignored by older versions.
fatal_error_backtraces = Off
