; Brewless runtime settings.
memory_limit = 256M
expose_php = Off
variables_order = EGPCS

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code in an image never changes, so there is nothing to revalidate.
opcache.validate_timestamps = 0
